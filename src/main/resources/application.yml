spring:
  application:
    name: video-service
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/videodb}
    username: ${DB_USER:videodb}
    password: ${DB_PASSWORD:videodb}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.video2frames: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_FORMAT:}

app:
  jwt:
    secret: ${JWT_SECRET:mDMUd7hxqi87Jab3PEoexGDbKUqx548RyntWmtrZJqJ}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  s3:
    bucket: ${S3_BUCKET:video2frames}
  sqs:
    video-uploaded-queue: ${SQS_VIDEO_UPLOADED_QUEUE:video-uploaded}
    video-processed-queue: ${SQS_VIDEO_PROCESSED_QUEUE:video-processed}
    video-failed-queue: ${SQS_VIDEO_FAILED_QUEUE:video-failed}
    poll-wait-time-seconds: 10
